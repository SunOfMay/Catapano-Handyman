<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Catapano Handyman | Handyman Services Across Zealand</title>

  <meta
    name="description"
    content="Reliable handyman services for homeowners, tenants and landlords. Based in Copenhagen and serving customers across Zealand."
  >

  <style>
    :root {
      --navy: #172b3a;
      --dark-navy: #0f1d27;
      --orange: #f28c28;
      --orange-dark: #d97412;
      --light-grey: #f5f7f8;
      --white: #ffffff;
      --text: #26343d;
      --muted: #66737c;
      --border: #dde4e8;
      --shadow: 0 10px 30px rgba(15, 29, 39, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: var(--white);
      line-height: 1.6;
    }

    a {
      color: inherit;
    }

    .container {
      width: min(1100px, calc(100% - 40px));
      margin: 0 auto;
    }

    /* Header */

    .site-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--white);
      border-bottom: 1px solid var(--border);
    }

    .header-content {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
    }

    .business-name {
      color: var(--navy);
      font-size: 1.2rem;
      font-weight: 800;
      text-decoration: none;
    }

    .desktop-navigation {
      display: flex;
      align-items: center;
      gap: 26px;
    }

    .desktop-navigation a {
      color: var(--navy);
      font-weight: 700;
      text-decoration: none;
    }

    .desktop-navigation a:hover {
      color: var(--orange-dark);
    }

    /* Buttons */

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 12px 22px;
      border: 2px solid var(--orange);
      border-radius: 7px;
      background: var(--orange);
      color: var(--white);
      font-weight: 800;
      text-decoration: none;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .button:hover {
      background: var(--orange-dark);
      border-color: var(--orange-dark);
    }

    .button-outline {
      border-color: var(--white);
      background: transparent;
      color: var(--white);
    }

    .button-outline:hover {
      border-color: var(--white);
      background: var(--white);
      color: var(--navy);
    }

    .small-button {
      min-height: 42px;
      padding: 9px 16px;
      font-size: 0.95rem;
    }

    /* Hero */

    .hero {
      padding: 105px 0;
      background: linear-gradient(135deg, var(--dark-navy), #29495c);
      color: var(--white);
    }

    .hero-content {
      max-width: 790px;
    }

    .hero h1 {
      max-width: 760px;
      margin: 0 0 24px;
      font-size: clamp(2.7rem, 7vw, 5rem);
      line-height: 1.04;
      letter-spacing: -2px;
    }

    .hero-description {
      max-width: 700px;
      margin: 0 0 32px;
      color: #e2e9ed;
      font-size: 1.18rem;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 30px;
    }

    .hero-contact {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 28px;
    }

    .hero-contact a {
      color: var(--white);
      font-weight: 700;
      text-decoration: none;
    }

    .hero-contact a:hover {
      color: #ffc986;
    }

    /* General sections */

    section {
      padding: 80px 0;
    }

    .section-heading {
      max-width: 720px;
      margin-bottom: 40px;
    }

    .section-heading h2,
    .about-copy h2,
    .service-area h2,
    .contact-introduction h2 {
      margin: 0 0 15px;
      color: var(--navy);
      font-size: clamp(2rem, 5vw, 2.8rem);
      line-height: 1.15;
    }

    .section-heading p,
    .about-copy p,
    .service-area p {
      color: var(--muted);
      font-size: 1.05rem;
    }

    /* Services */

    .services-section {
      background: var(--light-grey);
    }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .service-card {
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--white);
      box-shadow: var(--shadow);
    }

    .service-card h3 {
      margin: 0 0 10px;
      color: var(--navy);
      font-size: 1.25rem;
    }

    .service-card p {
      margin: 0;
      color: var(--muted);
    }

    /* About */

    .about-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 60px;
      align-items: center;
    }

    .benefits {
      padding: 32px;
      border-radius: 12px;
      background: var(--navy);
      color: var(--white);
    }

    .benefits h3 {
      margin: 0 0 15px;
      font-size: 1.4rem;
    }

    .benefits ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .benefits li {
      padding: 11px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
    }

    .benefits li:last-child {
      border-bottom: 0;
    }

    .benefits li::before {
      content: "✓";
      margin-right: 10px;
      color: #ffc986;
      font-weight: 900;
    }

    /* Service area */

    .service-area-section {
      background: var(--light-grey);
      text-align: center;
    }

    .service-area {
      max-width: 770px;
      margin: 0 auto;
    }

    .service-area p {
      margin-bottom: 27px;
    }

    /* Contact */

    .contact-section {
      background: var(--navy);
      color: var(--white);
    }

    .contact-layout {
      display: grid;
      grid-template-columns: 0.8fr 1.2fr;
      gap: 60px;
      align-items: start;
    }

    .contact-introduction h2 {
      color: var(--white);
    }

    .contact-introduction p {
      color: #dce5ea;
    }

    .contact-list {
      display: grid;
      gap: 10px;
      margin-top: 28px;
    }

    .contact-list a {
      color: var(--white);
      font-weight: 700;
      text-decoration: none;
    }

    .contact-list a:hover {
      color: #ffc986;
    }

    /* Contact form */

    .contact-form {
      padding: 32px;
      border-radius: 12px;
      background: var(--white);
      box-shadow: var(--shadow);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      color: var(--navy);
      font-weight: 700;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #cbd5da;
      border-radius: 7px;
      background: var(--white);
      color: var(--text);
      font: inherit;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--orange);
      outline: 3px solid rgba(242, 140, 40, 0.18);
    }

    .form-group textarea {
      min-height: 145px;
      resize: vertical;
    }

    .contact-form .button {
      width: 100%;
      cursor: pointer;
      font: inherit;
    }

    .form-note {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 0.86rem;
      text-align: center;
    }

    /* Footer */

    footer {
      padding: 25px 0;
      background: var(--dark-navy);
      color: #becad0;
      text-align: center;
      font-size: 0.9rem;
    }
